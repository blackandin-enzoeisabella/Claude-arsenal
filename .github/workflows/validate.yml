name: validate

on:
  push:
  pull_request:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar skills
        run: python3 scripts/validate.py
      - name: Testar instalador
        run: |
          bash scripts/install.sh --target "$RUNNER_TEMP/skills"
          test "$(ls "$RUNNER_TEMP/skills" | wc -l)" -ge 31
          bash scripts/install.sh --target "$RUNNER_TEMP/skills" --uninstall
          test "$(ls "$RUNNER_TEMP/skills" | wc -l)" -eq 0
